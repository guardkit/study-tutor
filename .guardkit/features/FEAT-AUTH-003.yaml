description: 'FEAT-AUTH-003 A3 app slice (KC-D7, gate KC-G3): a real KeycloakIdentityProvider
  implementing the unchanged 3-member IdentityProvider port (sync currentPrincipal
  kept; proactive background refresh; signIn silent-then-interactive). PKCE S256 public
  client, custom-scheme redirect com.appmilla.studytutor:/oauth2redirect, offline_access
  so the family device stays signed in. SignInScreen loading/failure/cancel + sign-out
  affordance; composeSessionApi de-typed to the port (hermetic fake flavour keeps
  the concrete fake). flutter_appauth + flutter_secure_storage added as a recorded
  zero-added-deps DoD scope event. KC-G3 live gate is operator_handoff.'
