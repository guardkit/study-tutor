smoke_gates:
  # Feature-level composition gate for the Flutter app slice. This is the
  # FLUTTER track, not the Python server — the R3 nudge's pytest example does
  # not apply; the project's per-wave green gate is `cd app && flutter test`
  # (docs/runbooks/RUNBOOK-overnight-fable-flutter.md). Path is flutter's
  # default discovery root app/test/ (verified to exist), so no explicit argv.
  #
  # after_wave 3: the KeycloakIdentityProvider (003) + SecureSessionStore (002)
  #   unit suites land — a broken adapter/store is caught here, not 3 tasks later.
  # after_wave 5: the composition de-type + error-routing regression (006) lands
  #   — catches a de-type compile break or an Unauthenticated/TransportError
  #   routing regression at the seam.
  #
  # Wave 6 (TASK-KCA3-007) is deliberately NOT gated: it is the KC-G3
  # operator_handoff live gate — AutoBuild short-circuits it and lands no code,
  # so wave 5 is the final code-bearing wave and the meaningful last gate. The
  # feature-validate "does not cover the final wave" warning is expected here.
  after_wave: [3, 5]
  command: |
    set -e
    cd app && flutter analyze && flutter test
  expected_exit: 0
  timeout: 300
