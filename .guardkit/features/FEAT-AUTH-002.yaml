smoke_gates:
  # Composition gate for the auth seam: after the resolver + boot wiring land
  # (wave 3) and after the tripwire re-scope edits test_auth.py (wave 4), run the
  # whole http unit suite so a broken table-mode parity or resolver/boot
  # integration is caught between waves, not 30 tasks later. Path is a verified
  # existing root (tests/unit/http); test_auth_keycloak.py is created in wave 2,
  # so both after_wave values are temporally safe.
  #
  # Wave 5 (TASK-KCA2-007) is deliberately NOT gated: it is the KC-G2
  # operator_handoff live gate — AutoBuild short-circuits it and lands no code,
  # so wave 4 is the final code-bearing wave and the meaningful last gate. The
  # feature-validate "does not cover the final wave" warning is expected here.
  after_wave: [3, 4]
  command: |
    set -e
    python -m pytest tests/unit/http -x -q
  expected_exit: 0
  timeout: 180
