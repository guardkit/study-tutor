id: FEAT-SMP-003
name: Durable Cross-Device Sessions
description: 'FEAT-SMP-003 / W3: the 6 PostgresStudentStore session methods over the
  merged W1 schema, wiring the SessionService into both MCP adapter sites with a config
  single-user identity, swapping the 4 MCP tools onto SessionService (surface byte-for-byte
  unchanged), and moving session-end learner-state persistence off Graphiti onto Postgres
  (Phase1MinimalDeltaPolicy over W2 reads -> durable record_session_completion, session.completed
  preserved). Durable + resumable cross-device sessions. Out of scope: HTTP/WS transport,
  real XP engine, Coach-verdict misconceptions, graph teardown (SMP-004).'
