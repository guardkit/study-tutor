# After Wave 2 (wired client) and Wave 3 (smoke test), run the always-on
# constructor-shape test as a composition gate. This is exactly the bug class
# this feature exists to repair — any future wave that re-introduces the
# silent OpenAI default would be caught here, not 30+ tasks downstream.
# Honours the F5/F7 review-report findings: constructor-shape test runs in CI
# without Tailscale, so the gate is portable.
smoke_gates:
  after_wave: [2, 3]
  command: |
    set -e
    pytest tests/smoke/test_graphiti_live_smoke.py::test_constructor_shape_no_cloud_defaults \
           tests/smoke/test_graphiti_live_smoke.py::test_kwarg_drift_detection \
           tests/smoke/test_graphiti_live_smoke.py::test_openai_api_key_never_read \
           -x -q
  expected_exit: 0
  timeout: 120
