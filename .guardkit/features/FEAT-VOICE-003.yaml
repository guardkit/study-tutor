# Between-wave composition gate. Fires after Wave 3 (MVP tap-to-talk loop
# assembled from port+adapter+fakes+recorder+UX), Wave 4 (streaming layered on),
# and Wave 5 (dual-backend/live tests — covers the final wave so nothing
# composes-broken ships unverified). Catches integration breakage per-task Coach
# approval cannot see. Dart/Flutter feature -> `flutter test` in app/, not pytest.
smoke_gates:
  after_wave: [3, 4, 5]
  command: |
    set -e
    cd app
    flutter test
  expected_exit: 0
  timeout: 600
