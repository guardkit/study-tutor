smoke_gates:
  after_wave_1:
    # Wave 1 ships pure-data modules; assert they import cleanly + entity construction works
    - python -c "from study_tutor.knowledge.student_model import Student, Subject, Text, Topic, AssessmentObjective, Misconception, TopicConfidence, STUDENT_GROUP_PREFIX, SUBJECT_GROUP_PREFIX, FLEET_GROUP_ID; assert FLEET_GROUP_ID == 'fleet:appmilla'"
    - python -c "from study_tutor.knowledge.episodes import EpisodeBase, SessionCompletedEpisode, TopicConfidenceUpdatedEpisode, MisconceptionObservedEpisode; assert 'episode_kind' in EpisodeBase.model_fields"
  after_wave_2:
    # Wave 2 ships substrate; assert client wrapper module-loads without graphiti-core, and CC-13 single-call-site invariant holds
    - python -c "from study_tutor.knowledge.graphiti_client import GraphitiConnectionConfig; cfg = GraphitiConnectionConfig(falkor_host='localhost', falkor_port=6379, database='t', embedder_url='http://x:8001'); assert cfg.timeout_seconds == 5.0"
    - bash -c 'count=$(git grep -nE "add_episode\\s*\\(" -- src/ | wc -l | tr -d " "); test "$count" = "1" || (echo "CC-13 violation: expected exactly 1 add_episode call site, found $count" && exit 1)'
  after_wave_3:
    # Wave 3 ships query helpers; assert the three async helpers are importable + the F3 contract is callable with client=None as a no-op
    - python -c "from study_tutor.knowledge.queries import get_student_state, get_topic_recommendations, record_session_completion; assert callable(get_student_state) and callable(get_topic_recommendations) and callable(record_session_completion)"
  after_wave_4:
    # Wave 4 ships seeding; assert script is a callable module + has the verification-gate import
    - python -c "import scripts.seed_student_model as s; assert hasattr(s, 'require_client_or_exit')"
