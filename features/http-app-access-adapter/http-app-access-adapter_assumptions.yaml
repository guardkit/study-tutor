    assumption: "An authenticated-but-unseeded student is refused as Unauthenticated"
    confidence: low
    basis: >-
      A token whose student has no identity row is an unresolvable principal;
      mapping to Unauthenticated keeps the §9 closed error set intact (a new
      error_type would require /design-refine, blocking this build on a
      contract change). This is the REVIEW-REQUIRED item carried from the
      2026-07-05 handoff alignment review — session.student_id FKs student
      (schema_reference.sql:47) and create_session (postgres.py:672) does not
      auto-create, so without this rule the wire behaviour would be an
      IntegrityError-driven 500. Coach must verify the binding doc records it.
    human_response: "confirmed"

