# docker-compose.study-tutor.yml — TASK-NATS-PH3-002 / FEAT-NATS
#
# Runs the study-tutor (gcse-tutor) NATS subscriber alongside the existing
# specialist-agent dual-role stack. NATS itself is provisioned elsewhere
# (see nats-infrastructure/); this compose file ONLY adds the tutor container
# and connects it to a NATS server that is already running on the host or in
# a sibling stack.
#
# Critical (Bug #3 — see TASK-NATS-PH1-007):
#   OPENAI_BASE_URL MUST end with `/v1`. langchain-openai's ChatOpenAI client
#   appends `/chat/completions` to the configured base URL, so
#   `http://host.docker.internal:9000` (no `/v1`) yields a POST to
#   `/chat/completions` and the upstream llama-swap proxy returns 404 —
#   visible only mid-`tutor_turn`, not at startup. The default below
#   includes `/v1`; the regression-guard test
#   tests/unit/test_compose_structure.py asserts every override path keeps
#   that suffix.
#
# Usage (typical: NATS already running on the host on port 4222):
#   Populate study-tutor/.env with NATS_USER=rich and NATS_PASSWORD=<password>
#   (the .env file is git-ignored). `docker compose` auto-loads it from the
#   compose project directory, so no shell exports are needed:
#     docker compose -f docker-compose.study-tutor.yml up -d
#
# Override NATS host (e.g. point at a remote NATS over Tailscale):
#   NATS_HOST=promaxgb10-41b1 \
#     docker compose -f docker-compose.study-tutor.yml up -d
#
# Validate without starting:
#   docker compose -f docker-compose.study-tutor.yml config

services:
  gcse-tutor:
    # `study-tutor:dev` is built by scripts/build-image.sh (TASK-NATS-PH3-003).
    # The build: directive is provided as a fallback so a fresh checkout can
    # `compose up` without a separate build step; the image: tag is what gets
    # cached and reused on subsequent runs.
    image: study-tutor:dev
    build:
      context: ..
      dockerfile: study-tutor/Dockerfile
      additional_contexts:
        nats-core: ../nats-core
    # host-gateway resolves to the Docker host's IP so the container can reach
    # llama-swap (port 9000) and NATS (port 4222) running on the host. This
    # mirrors specialist-agent/docker-compose.dual-role.yml's pattern.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # NATS connection — host and credentials come from the environment.
      # NATS_HOST defaults to host.docker.internal so the container reaches
      # NATS on the Docker host; override to point at a remote NATS.
      NATS_URL: nats://${NATS_HOST:-host.docker.internal}:4222
      # `appmilla` is the *account* name, not a user. Valid users inside
      # the APPMILLA account are `rich` and `james` (see
      # nats-infrastructure/config/accounts/accounts.conf.template).
      # Sending `appmilla` as the username triggers an Authorization
      # Violation at connect time.
      #
      # The variable name (`NATS_USER`, unprefixed) intentionally matches
      # `specialist-agent/docker-compose.dual-role.yml` so a single `.env`
      # file in either project root carries NATS auth for both projects.
      # The only asymmetry is the default value: study-tutor defaults to
      # `rich` (this is the GCSE-tutor demo's primary persona); specialist-
      # agent leaves the default empty.
      NATS_USER: ${NATS_USER:-rich}
      # `:?must-be-set` makes `compose up` fail with a clear error if the
      # password is missing instead of starting the container with an empty
      # password and silently failing auth at first NATS connect.
      NATS_PASSWORD: ${NATS_PASSWORD:?must-be-set}

      # Identity used by serve-nats to register heartbeat / capability records.
      AGENT_ID: gcse-tutor

      # LLM endpoints — see Bug #3 note above. The /v1 suffix on
      # OPENAI_BASE_URL is non-negotiable for langchain-openai compatibility.
      # LLM_BASE_URL (no /v1) is the bare host that the GBNF/llama.cpp
      # branches use directly; keep them separate so each consumer hits the
      # path it expects.
      OPENAI_BASE_URL: ${TUTOR_OPENAI_BASE_URL:-http://host.docker.internal:9000/v1}
      LLM_BASE_URL: ${TUTOR_LLM_BASE_URL:-http://host.docker.internal:9000}
      LOCAL_MODEL: ${TUTOR_LOCAL_MODEL:-gemma4-tutor}
      # LOCAL_BASE_URL is the bare base URL that
      # ``study_tutor.llm.client.LLMClient._generate_openai_compat`` reads
      # when the Player provider (provider=local) issues an OpenAI-compat
      # POST. The helper appends `/v1/chat/completions` itself, so the
      # value here MUST be bare (no `/v1` suffix) — same shape as
      # LLM_BASE_URL above. Without this var the Player falls back to
      # ``DEFAULT_LOCAL_BASE_URL = "http://localhost:11434"`` which fails
      # inside the container (the host is unreachable as `localhost`).
      # Surfaced as Bug #9 (2026-05-10 run-2) one layer below the
      # provider-name vs model-alias conflation fixed below.
      LOCAL_BASE_URL: ${TUTOR_LLM_BASE_URL:-http://host.docker.internal:9000}
      # LOCAL_COACH_MODEL is the actual model alias passed in the
      # OpenAI-compat payload's ``"model": ...`` field when the Coach
      # provider (provider=local-coach) issues a turn. Resolved by
      # ``LLMClient._generate_openai_compat`` via ``LOCAL_COACH_MODEL`` env
      # — distinct from ``AGENT_MODELS__COACH_MODEL`` below, which is the
      # **provider name** (one of ``local`` / ``local-coach`` / ``bedrock``).
      # The Coach reuses ``LOCAL_BASE_URL`` (set above) as its base URL —
      # ``LLMClient._generate_openai_compat`` falls back to it when
      # ``LOCAL_COACH_BASE_URL`` is unset, which is the single-host case
      # the demo runs in.
      LOCAL_COACH_MODEL: ${TUTOR_COACH_MODEL:-qwen36-workhorse}
      # llama-swap doesn't require auth, but langchain-openai refuses to
      # construct a client with an empty api_key, so we pass a sentinel.
      OPENAI_API_KEY: ${TUTOR_OPENAI_API_KEY:-local-no-auth-required}

      # Cadence at which serve-nats publishes heartbeat KV entries; the
      # heartbeat is the liveness signal in lieu of an HTTP healthcheck.
      HEARTBEAT_INTERVAL_SECONDS: 30

      # nats_core.AgentConfig (BaseSettings, env_prefix=AGENT_,
      # env_nested_delimiter=__) is what serve-nats actually instantiates.
      # The flat LOCAL_MODEL / OPENAI_BASE_URL above are still consumed by
      # study-tutor's LLM client and graphiti client, but the AGENT_-
      # prefixed nested vars below are what populate the required
      # `models: ModelConfig` field on AgentConfig — without them the
      # container crash-loops with "models Field required". Mirrors the
      # convention specialist-agent's docker-compose.dual-role.yml uses.
      #
      # IMPORTANT — provider name vs model alias distinction (Bug #9,
      # 2026-05-10 run-2). The values below are **provider names** —
      # exactly ``local``, ``local-coach``, or ``bedrock``, as branched on
      # by ``study_tutor.llm.client.LLMClient.generate`` (the canonical
      # contract is enforced by ``_default_player_model`` /
      # ``_default_coach_model``, which return the env var verbatim). The
      # actual model aliases (``gemma4-tutor``, ``qwen36-workhorse``) live
      # in ``LOCAL_MODEL`` / ``LOCAL_COACH_MODEL`` above and are sent
      # downstream in the OpenAI-compat payload's ``"model": ...`` field.
      # Setting these AGENT_MODELS__* vars to an alias (e.g.
      # ``gemma4-tutor``) raises ``LLMProviderError: Unsupported
      # provider`` on the first turn — visible only mid-``tutor_turn``,
      # not at startup. The regression-guard tests under
      # ``tests/unit/test_compose_structure.py`` assert that the defaults
      # are valid provider names.
      AGENT_MODELS__REASONING_MODEL: ${TUTOR_REASONING_PROVIDER:-local}
      AGENT_MODELS__REASONING_ENDPOINT: ${TUTOR_OPENAI_BASE_URL:-http://host.docker.internal:9000/v1}
      # Coach provider — must differ from REASONING_MODEL (D3 two-provider
      # invariant, decision D-COACH-05 / FEAT-6CC5; no fallback is
      # permitted — enforced by validate_coach_config, see
      # study_tutor.llm.client._default_coach_model). Default to
      # ``local-coach`` (a distinct provider name from the Player's
      # ``local``) so the invariant holds by construction; the actual
      # Coach model alias lives in ``LOCAL_COACH_MODEL`` above and is
      # overridable via ``TUTOR_COACH_MODEL``. Override the provider
      # itself via ``TUTOR_COACH_PROVIDER`` (rare — only when adding a
      # new backend).
      AGENT_MODELS__COACH_MODEL: ${TUTOR_COACH_PROVIDER:-local-coach}
      AGENT_MODELS__COACH_ENDPOINT: ${TUTOR_COACH_ENDPOINT:-http://host.docker.internal:9000/v1}
      AGENT_HEARTBEAT_INTERVAL_SECONDS: 30
    # `unless-stopped` survives Docker daemon restarts but respects an
    # explicit `docker compose down` from the operator.
    restart: unless-stopped
