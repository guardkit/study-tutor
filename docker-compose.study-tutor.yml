# docker-compose.study-tutor.yml — TASK-NATS-PH3-002 / FEAT-NATS
#
# Runs the study-tutor (gcse-tutor) NATS subscriber alongside the existing
# specialist-agent dual-role stack. NATS itself is provisioned elsewhere
# (see nats-infrastructure/); this compose file ONLY adds the tutor container
# and connects it to a NATS server that is already running on the host or in
# a sibling stack.
#
# Critical (Bug #3 — see TASK-NATS-PH1-007):
#   OPENAI_BASE_URL MUST end with `/v1`. langchain-openai's ChatOpenAI client
#   appends `/chat/completions` to the configured base URL, so
#   `http://host.docker.internal:9000` (no `/v1`) yields a POST to
#   `/chat/completions` and the upstream llama-swap proxy returns 404 —
#   visible only mid-`tutor_turn`, not at startup. The default below
#   includes `/v1`; the regression-guard test
#   tests/unit/test_compose_structure.py asserts every override path keeps
#   that suffix.
#
# Usage (typical: NATS already running on the host on port 4222):
#   RICH_NATS_PASSWORD=<password> \
#     docker compose -f docker-compose.study-tutor.yml up -d
#
# Override NATS host (e.g. point at a remote NATS over Tailscale):
#   NATS_HOST=promaxgb10-41b1 RICH_NATS_PASSWORD=<password> \
#     docker compose -f docker-compose.study-tutor.yml up -d
#
# Validate without starting:
#   docker compose -f docker-compose.study-tutor.yml config

services:
  gcse-tutor:
    # `study-tutor:dev` is built by scripts/build-image.sh (TASK-NATS-PH3-003).
    # The build: directive is provided as a fallback so a fresh checkout can
    # `compose up` without a separate build step; the image: tag is what gets
    # cached and reused on subsequent runs.
    image: study-tutor:dev
    build:
      context: ..
      dockerfile: study-tutor/Dockerfile
      additional_contexts:
        nats-core: ../nats-core
    # host-gateway resolves to the Docker host's IP so the container can reach
    # llama-swap (port 9000) and NATS (port 4222) running on the host. This
    # mirrors specialist-agent/docker-compose.dual-role.yml's pattern.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # NATS connection — host and credentials come from the environment.
      # NATS_HOST defaults to host.docker.internal so the container reaches
      # NATS on the Docker host; override to point at a remote NATS.
      NATS_URL: nats://${NATS_HOST:-host.docker.internal}:4222
      NATS_USER: ${RICH_NATS_USER:-appmilla}
      # `:?must-be-set` makes `compose up` fail with a clear error if the
      # password is missing instead of starting the container with an empty
      # password and silently failing auth at first NATS connect.
      NATS_PASSWORD: ${RICH_NATS_PASSWORD:?must-be-set}

      # Identity used by serve-nats to register heartbeat / capability records.
      AGENT_ID: gcse-tutor

      # LLM endpoints — see Bug #3 note above. The /v1 suffix on
      # OPENAI_BASE_URL is non-negotiable for langchain-openai compatibility.
      # LLM_BASE_URL (no /v1) is the bare host that the GBNF/llama.cpp
      # branches use directly; keep them separate so each consumer hits the
      # path it expects.
      OPENAI_BASE_URL: ${TUTOR_OPENAI_BASE_URL:-http://host.docker.internal:9000/v1}
      LLM_BASE_URL: ${TUTOR_LLM_BASE_URL:-http://host.docker.internal:9000}
      LOCAL_MODEL: ${TUTOR_LOCAL_MODEL:-gemma4-tutor}
      # llama-swap doesn't require auth, but langchain-openai refuses to
      # construct a client with an empty api_key, so we pass a sentinel.
      OPENAI_API_KEY: ${TUTOR_OPENAI_API_KEY:-local-no-auth-required}

      # Cadence at which serve-nats publishes heartbeat KV entries; the
      # heartbeat is the liveness signal in lieu of an HTTP healthcheck.
      HEARTBEAT_INTERVAL_SECONDS: 30
    # `unless-stopped` survives Docker daemon restarts but respects an
    # explicit `docker compose down` from the operator.
    restart: unless-stopped
