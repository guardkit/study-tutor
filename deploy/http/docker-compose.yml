# study-tutor HTTP Session API — independent deployment (FEAT-APP-001 / ADR-ARCH-023).
# Port 8100, NO NATS dependency. Runs study-tutor serve-http against StudentStore (Postgres).
# Prerequisites: StudentStore (deploy/postgres/) running; study-tutor seed-students executed.
# Flavours: Dev (two tokens + reset flag) vs Prod (single token, no reset).
services:
  study_tutor_http:
    # Build context is the PARENT of the repo: the Dockerfile sources the
    # sibling nats-core repo via a BuildKit named context (same shape as the
    # root docker-compose.study-tutor.yml — additional_contexts, not a build
    # arg). Paths are relative to this compose file (deploy/http/).
    build:
      context: ../../..
      dockerfile: study-tutor/Dockerfile
      additional_contexts:
        nats-core: ../../../nats-core
    image: study-tutor:latest
    container_name: study_tutor_http
    restart: unless-stopped
    command: ["study-tutor", "serve-http", "--host", "0.0.0.0", "--port", "8100"]
    # host-gateway lets the container reach llama-swap on the Docker host
    # (port 9000) — the tutor loop's model endpoints below depend on it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Postgres DSN — required; fail fast if missing
      STUDY_TUTOR_PG_DSN: ${STUDY_TUTOR_PG_DSN:?set STUDY_TUTOR_PG_DSN in .env}

      # HTTP auth token table (JSON) — required; fail fast if missing
      # Dev: {"token-lilymay": "lilymay", "token-alex": "alex"}
      # Prod: {"token-lilymay": "lilymay"}
      STUDY_TUTOR_HTTP_TOKENS: ${STUDY_TUTOR_HTTP_TOKENS:?set STUDY_TUTOR_HTTP_TOKENS in .env}

      # Dev-only reset flag — gates POST /__dev__/reset (TASK-APP1-05)
      # Dev: STUDY_TUTOR_HTTP_DEV_RESET=1
      # Prod: unset (route does not exist)
      STUDY_TUTOR_HTTP_DEV_RESET: ${STUDY_TUTOR_HTTP_DEV_RESET:-}

      # Tutor-loop model config — serve-http boots the SAME tutor loop as
      # serve/serve-nats (two-provider invariant validated at boot), so the
      # model env mirrors the root docker-compose.study-tutor.yml. Defaults
      # target llama-swap on the Docker host (GB10 :9000).
      AGENT_MODELS__REASONING_MODEL: ${TUTOR_REASONING_PROVIDER:-local}
      AGENT_MODELS__REASONING_ENDPOINT: ${TUTOR_OPENAI_BASE_URL:-http://host.docker.internal:9000/v1}
      AGENT_MODELS__COACH_MODEL: ${TUTOR_COACH_PROVIDER:-local-coach}
      AGENT_MODELS__COACH_ENDPOINT: ${TUTOR_COACH_ENDPOINT:-http://host.docker.internal:9000/v1}
      OPENAI_BASE_URL: ${TUTOR_OPENAI_BASE_URL:-http://host.docker.internal:9000/v1}
      LLM_BASE_URL: ${TUTOR_LLM_BASE_URL:-http://host.docker.internal:9000}
      LOCAL_MODEL: ${TUTOR_LOCAL_MODEL:-gemma4-tutor}
      LOCAL_BASE_URL: ${TUTOR_LLM_BASE_URL:-http://host.docker.internal:9000}
      LOCAL_COACH_MODEL: ${TUTOR_COACH_MODEL:-qwen36-workhorse}
      OPENAI_API_KEY: ${TUTOR_OPENAI_API_KEY:-local-no-auth-required}

      # Voice (TASK-VOX-006) — routes exist only when STUDY_TUTOR_VOICE_ENABLED
      # is true in .env. Empty values fall back to the code defaults
      # (VoiceConfig.from_env: GB10 llama-swap :9000, parakeet-tdt / qwen3-tts).
      STUDY_TUTOR_VOICE_ENABLED: ${STUDY_TUTOR_VOICE_ENABLED:-}
      STT_BASE_URL: ${STT_BASE_URL:-}
      STT_MODEL: ${STT_MODEL:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_VOICE: ${TTS_VOICE:-}

      # RAG (Lane 2 step 1b, 2026-08-02) — the [rag] extra ships in the image
      # and serve-http wires the baked data/chroma store at boot. The store is
      # re-embedded at 1024-dim to match the spark llama-swap's `embed` alias
      # (Qwen3-Embedding-0.6B); the code's default model name (nomic-embed) is
      # NOT served here, so the model override below is load-bearing. See the
      # Lane 2 1a receipt (RESULTS-lane2-rag-image-1a-2026-08-01.md).
      LLM_EMBEDDINGS_BASE_URL: ${LLM_EMBEDDINGS_BASE_URL:-http://host.docker.internal:9000/v1}
      LLM_EMBEDDINGS_MODEL: ${LLM_EMBEDDINGS_MODEL:-embed}
      LLM_EMBEDDINGS_API_KEY: ${LLM_EMBEDDINGS_API_KEY:-not-needed}
      # Reranker weights cache, persisted on the host so container restarts
      # don't re-download ~2.3GB. Set HF_HUB_OFFLINE=1 in .env ONLY once the
      # cache is warm (a cold cache with offline=1 breaks reranker load).
      HF_HOME: /hf-cache
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-}
    volumes:
      - ${HF_CACHE_DIR:-/opt/study-tutor/hf-cache}:/hf-cache
    ports:
      - "${HTTP_PORT:-8100}:8100"
    healthcheck:
      # python, not curl — the python:3.11-slim base image ships no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
