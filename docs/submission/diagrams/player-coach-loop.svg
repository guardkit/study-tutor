<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Player-Coach adversarial dataset generation loop</title>
<desc>Player agent generates tutoring examples. Coach evaluates against GOAL.md criteria. Rejected examples revised up to 5 times. Accepted examples route to behaviour or knowledge output.</desc>
<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="36" text-anchor="middle">Player-Coach adversarial loop</text>
<text class="ts" x="340" y="56" text-anchor="middle">The single most important pattern in the dataset factory.</text>

<rect x="40" y="90" width="130" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/>
<text class="th" x="105" y="112" text-anchor="middle" dominant-baseline="central" fill="#444441">GOAL.md</text>
<text class="ts" x="105" y="130" text-anchor="middle" dominant-baseline="central">+ source PDFs</text>
<line x1="170" y1="118" x2="208" y2="118" class="arr" marker-end="url(#arrow)"/>

<rect x="210" y="80" width="160" height="76" rx="10" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="290" y="106" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500" font-family="system-ui">Player agent</text>
<text x="290" y="126" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12" font-family="system-ui">Retrieves chunks</text>
<text x="290" y="142" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12" font-family="system-ui">Generates examples</text>

<line x1="370" y1="118" x2="418" y2="118" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="394" y="108" text-anchor="middle">submit</text>

<rect x="420" y="80" width="160" height="76" rx="10" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/>
<text x="500" y="106" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500" font-family="system-ui">Coach agent</text>
<text x="500" y="126" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12" font-family="system-ui">Evaluates quality</text>
<text x="500" y="142" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12" font-family="system-ui">Read-only, no tools</text>

<rect x="420" y="196" width="160" height="44" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/>
<text class="th" x="500" y="222" text-anchor="middle" dominant-baseline="central" fill="#444441">Decision</text>
<line x1="500" y1="156" x2="500" y2="194" class="arr" marker-end="url(#arrow)"/>

<path d="M420 218 L290 218 L290 158" fill="none" marker-end="url(#arrow)" stroke="#E24B4A" stroke-width="1.5"/>
<rect x="310" y="196" width="100" height="30" rx="6" stroke-width="0.5" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="360" y="214" text-anchor="middle" dominant-baseline="central" fill="#791F1F" font-size="12" font-family="system-ui">Reject (≤5×)</text>

<line x1="500" y1="240" x2="500" y2="278" marker-end="url(#arrow)" stroke="#1D9E75" stroke-width="1.5" fill="none"/>
<text x="530" y="264" fill="#1D9E75" font-size="12" font-family="system-ui">Accept</text>

<rect x="420" y="280" width="160" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="500" y="306" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500" font-family="system-ui">Layer router</text>

<path d="M460 324 L460 360 L300 360 L300 380" fill="none" class="arr" marker-end="url(#arrow)"/>
<rect x="200" y="382" width="200" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/>
<text x="300" y="404" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-size="14" font-weight="500" font-family="system-ui">train.jsonl</text>
<text x="300" y="422" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-size="12" font-family="system-ui">Behaviour → fine-tuning</text>

<path d="M540 324 L540 360 L620 360 L620 380" fill="none" class="arr" marker-end="url(#arrow)"/>
<rect x="530" y="382" width="140" height="56" rx="8" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
<text x="600" y="404" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500" font-family="system-ui">rag_index/</text>
<text x="600" y="422" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12" font-family="system-ui">Knowledge → RAG</text>

<path d="M210 218 L120 218 L120 390" fill="none" marker-end="url(#arrow)" stroke="#5F5E5A" stroke-width="1"/>
<rect x="60" y="392" width="120" height="44" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="120" y="410" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="12" font-family="system-ui">Discard + log</text>
<text x="120" y="426" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12" font-family="system-ui">if max turns hit</text>
</svg>