<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>StudyTutor hardware topology</title>
<desc>Three-node home network: DGX Spark GB10, Synology NAS, and student laptop connected via Tailscale.</desc>
<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="32" text-anchor="middle">Hardware topology — everything runs at home</text>

<rect x="210" y="70" width="260" height="130" rx="12" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="340" y="98" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500" font-family="system-ui">NVIDIA DGX Spark GB10</text>
<text x="340" y="120" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12" font-family="system-ui">128GB unified LPDDR5x memory</text>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12" font-family="system-ui">Blackwell GPU, 6144 CUDA cores</text>
<text x="340" y="160" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12" font-family="system-ui">Inference + fine-tuning + agents</text>
<text x="340" y="180" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12" font-family="system-ui">1 petaFLOP FP4</text>

<rect x="520" y="100" width="140" height="76" rx="10" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/>
<text x="590" y="126" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500" font-family="system-ui">Synology NAS</text>
<text x="590" y="146" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12" font-family="system-ui">FalkorDB :6379</text>
<text x="590" y="162" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12" font-family="system-ui">32TB storage</text>

<line x1="470" y1="138" x2="518" y2="138" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="494" y="128" text-anchor="middle">LAN</text>

<rect x="60" y="260" width="160" height="56" rx="10" stroke-width="0.5" fill="#FBEAF0" stroke="#993556"/>
<text x="140" y="282" text-anchor="middle" dominant-baseline="central" fill="#72243E" font-size="14" font-weight="500" font-family="system-ui">Student laptop</text>
<text x="140" y="300" text-anchor="middle" dominant-baseline="central" fill="#993556" font-size="12" font-family="system-ui">Open WebUI in browser</text>

<rect x="420" y="260" width="180" height="56" rx="10" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="510" y="282" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="14" font-weight="500" font-family="system-ui">MacBook Pro M2 Max</text>
<text x="510" y="300" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12" font-family="system-ui">Planning + Claude Desktop</text>

<rect x="40" y="230" width="580" height="106" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="340" y="248" text-anchor="middle">Tailscale mesh — encrypted, peer-to-peer, no port forwarding</text>

<line x1="140" y1="260" x2="280" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="260" x2="400" y2="200" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="340" y="348" text-anchor="middle">No cloud. No subscription. No data leaving the home network.</text>
</svg>