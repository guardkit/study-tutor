<svg width="100%" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>StudyTutor system architecture</title>
<desc>Student laptop connects via Tailscale to Open WebUI on DGX Spark GB10, which runs fine-tuned Gemma 4 via llama-swap, ChromaDB for RAG, and Graphiti for memory.</desc>
<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="32" text-anchor="middle">StudyTutor system architecture</text>

<rect x="160" y="120" width="480" height="400" rx="16" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/>
<text class="ts" x="180" y="144">DGX Spark GB10 — 128GB unified memory</text>

<rect x="20" y="170" width="110" height="56" rx="8" stroke-width="0.5" fill="#FBEAF0" stroke="#993556"/>
<text x="75" y="192" text-anchor="middle" dominant-baseline="central" fill="#72243E" font-size="14" font-weight="500" font-family="system-ui">Student</text>
<text x="75" y="210" text-anchor="middle" dominant-baseline="central" fill="#993556" font-size="12" font-family="system-ui">Laptop / tablet</text>

<line x1="130" y1="198" x2="178" y2="198" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="154" y="188" text-anchor="middle">Tailscale</text>

<rect x="180" y="170" width="140" height="56" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="250" y="192" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500" font-family="system-ui">Open WebUI</text>
<text x="250" y="210" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12" font-family="system-ui">Chat interface</text>

<line x1="320" y1="198" x2="368" y2="198" class="arr" marker-end="url(#arrow)"/>

<rect x="370" y="170" width="140" height="56" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/>
<text x="440" y="192" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500" font-family="system-ui">Jarvis</text>
<text x="440" y="210" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12" font-family="system-ui">Intent router</text>

<line x1="440" y1="226" x2="440" y2="264" class="arr" marker-end="url(#arrow)"/>

<rect x="340" y="266" width="200" height="56" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/>
<text x="440" y="288" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-size="14" font-weight="500" font-family="system-ui">Study tutor agent</text>
<text x="440" y="306" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-size="12" font-family="system-ui">Socratic tutoring harness</text>

<line x1="440" y1="322" x2="440" y2="360" class="arr" marker-end="url(#arrow)"/>

<rect x="340" y="362" width="200" height="56" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="440" y="384" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="14" font-weight="500" font-family="system-ui">llama-swap :9000</text>
<text x="440" y="402" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12" font-family="system-ui">Unified inference</text>

<line x1="440" y1="418" x2="440" y2="446" class="arr" marker-end="url(#arrow)"/>

<rect x="340" y="448" width="200" height="44" rx="8" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/>
<text x="440" y="474" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-size="14" font-weight="500" font-family="system-ui">Gemma 4 26B MoE + LoRA</text>

<rect x="180" y="290" width="130" height="56" rx="8" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
<text x="245" y="312" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500" font-family="system-ui">ChromaDB</text>
<text x="245" y="330" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12" font-family="system-ui">RAG knowledge</text>

<line x1="340" y1="294" x2="312" y2="310" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="366" width="130" height="56" rx="8" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
<text x="245" y="388" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500" font-family="system-ui">nomic-embed</text>
<text x="245" y="406" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12" font-family="system-ui">768-dim, always-on</text>

<line x1="245" y1="346" x2="245" y2="364" class="arr" marker-end="url(#arrow)"/>

<rect x="560" y="290" width="100" height="76" rx="8" stroke-width="0.5" fill="#EEEDFE" stroke="#534AB7"/>
<text x="610" y="316" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500" font-family="system-ui">Graphiti</text>
<text x="610" y="336" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12" font-family="system-ui">FalkorDB</text>
<text x="610" y="352" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12" font-family="system-ui">NAS :6379</text>

<line x1="540" y1="294" x2="558" y2="310" class="arr" marker-end="url(#arrow)"/>

<rect x="180" y="448" width="130" height="44" rx="8" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="245" y="474" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="14" font-weight="500" font-family="system-ui">Docling ingestion</text>

<line x1="245" y1="448" x2="245" y2="424" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="245" y="510" text-anchor="middle">Mr Bruff guides, AQA papers,</text>
<text class="ts" x="245" y="526" text-anchor="middle">mark schemes, examiner reports</text>

<rect x="20" y="280" width="110" height="44" rx="8" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="75" y="306" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500" font-family="system-ui">£0.00/session</text>
<text class="ts" x="75" y="340" text-anchor="middle">Zero marginal cost</text>
