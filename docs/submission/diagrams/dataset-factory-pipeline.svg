<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Training data generation pipeline</title>
<desc>End-to-end pipeline: GOAL.md plus source PDFs feed a Player-Coach loop, producing validated JSONL split into behaviour and knowledge layers.</desc>
<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="36" text-anchor="middle">Training data generation pipeline</text>
<text class="ts" x="340" y="56" text-anchor="middle">Adding a new domain = a config change, not code.</text>

<rect x="40" y="90" width="120" height="70" rx="10" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="100" y="116" text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="14" font-weight="500" font-family="system-ui">GOAL.md</text>
<text x="100" y="138" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12" font-family="system-ui">+ source PDFs</text>

<line x1="160" y1="125" x2="188" y2="125" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="90" width="110" height="70" rx="10" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
<text x="245" y="116" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500" font-family="system-ui">Docling</text>
<text x="245" y="138" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-size="12" font-family="system-ui">PDF → chunks</text>

<line x1="300" y1="125" x2="328" y2="125" class="arr" marker-end="url(#arrow)"/>

<rect x="330" y="82" width="130" height="86" rx="10" stroke-width="0.5" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="395" y="108" text-anchor="middle" dominant-baseline="central" fill="#085041" font-size="14" font-weight="500" font-family="system-ui">Player-Coach</text>
<text x="395" y="128" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12" font-family="system-ui">Adversarial loop</text>
<text x="395" y="148" text-anchor="middle" dominant-baseline="central" fill="#0F6E56" font-size="12" font-family="system-ui">Runs overnight</text>

<line x1="460" y1="125" x2="488" y2="125" class="arr" marker-end="url(#arrow)"/>

<rect x="490" y="90" width="140" height="70" rx="10" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/>
<text x="560" y="116" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-size="14" font-weight="500" font-family="system-ui">Validated JSONL</text>
<text x="560" y="138" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-size="12" font-family="system-ui">ShareGPT format</text>

<line x1="80" y1="200" x2="600" y2="200" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>

<text x="240" y="234" text-anchor="middle" fill="#712B13" font-size="14" font-weight="500" font-family="system-ui">Behaviour layer</text>
<rect x="100" y="252" width="280" height="80" rx="10" stroke-width="0.5" fill="#FAECE7" stroke="#993C1D"/>
<text x="120" y="278" dominant-baseline="central" fill="#712B13" font-size="14" font-weight="500" font-family="system-ui">train.jsonl</text>
<text x="120" y="300" dominant-baseline="central" fill="#993C1D" font-size="12" font-family="system-ui">Teaches HOW to respond —</text>
<text x="120" y="318" dominant-baseline="central" fill="#993C1D" font-size="12" font-family="system-ui">vocabulary, judgment, style</text>

<text x="520" y="234" text-anchor="middle" fill="#0C447C" font-size="14" font-weight="500" font-family="system-ui">Knowledge layer</text>
<rect x="400" y="252" width="230" height="80" rx="10" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
<text x="420" y="278" dominant-baseline="central" fill="#0C447C" font-size="14" font-weight="500" font-family="system-ui">rag_index/</text>
<text x="420" y="300" dominant-baseline="central" fill="#185FA5" font-size="12" font-family="system-ui">Provides WHAT to draw</text>
<text x="420" y="318" dominant-baseline="central" fill="#185FA5" font-size="12" font-family="system-ui">from — independently updatable</text>

<path d="M520 160 L520 178 L240 178 L240 250" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M580 160 L580 178 L515 178 L515 250" fill="none" class="arr" marker-end="url(#arrow)"/>
</svg>