<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>StudyTutor four-layer architecture</title>
<desc>Four independently upgradeable layers: fine-tuned model for behaviour, RAG for knowledge, agent harness for quality, and memory for continuity.</desc>

<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .purple-fill { fill: #EEEDFE; stroke: #534AB7; }
  .purple-th { fill: #3C3489; font-size: 14px; font-weight: 500; }
  .purple-ts { fill: #534AB7; font-size: 12px; }
  .teal-fill { fill: #E1F5EE; stroke: #0F6E56; }
  .teal-th { fill: #085041; font-size: 14px; font-weight: 500; }
  .teal-ts { fill: #0F6E56; font-size: 12px; }
  .coral-fill { fill: #FAECE7; stroke: #993C1D; }
  .coral-th { fill: #712B13; font-size: 14px; font-weight: 500; }
  .coral-ts { fill: #993C1D; font-size: 12px; }
  .blue-fill { fill: #E6F1FB; stroke: #185FA5; }
  .blue-th { fill: #0C447C; font-size: 14px; font-weight: 500; }
  .blue-ts { fill: #185FA5; font-size: 12px; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="th" x="340" y="36" text-anchor="middle">StudyTutor — four-layer architecture</text>
<text class="ts" x="340" y="56" text-anchor="middle">Each layer independently upgradeable. Each amplifies the others.</text>

<!-- Layer 4: Memory -->
<rect class="purple-fill" x="80" y="80" width="520" height="70" rx="10" stroke-width="0.5"/>
<text class="purple-th" x="100" y="108" dominant-baseline="central">Layer 4 — Memory</text>
<text class="purple-ts" x="100" y="130" dominant-baseline="central">Graphiti temporal knowledge graph. Session history, weak areas, progress.</text>

<line x1="340" y1="150" x2="340" y2="168" class="arr" marker-end="url(#arrow)"/>

<!-- Layer 3: Harness -->
<rect class="teal-fill" x="80" y="170" width="520" height="70" rx="10" stroke-width="0.5"/>
<text class="teal-th" x="100" y="198" dominant-baseline="central">Layer 3 — Agent harness</text>
<text class="teal-ts" x="100" y="220" dominant-baseline="central">Context assembly, selective retrieval, response formatting, quality enforcement.</text>

<line x1="340" y1="240" x2="340" y2="258" class="arr" marker-end="url(#arrow)"/>

<!-- Layer 2: Fine-tuned model -->
<rect class="coral-fill" x="80" y="260" width="246" height="90" rx="10" stroke-width="0.5"/>
<text class="coral-th" x="100" y="290" dominant-baseline="central">Layer 2 — Fine-tuned model</text>
<text class="coral-ts" x="100" y="312" dominant-baseline="central">Gemma 4 26B MoE + LoRA</text>
<text class="coral-ts" x="100" y="330" dominant-baseline="central">Teaches HOW to respond</text>

<!-- Layer 1: RAG -->
<rect class="blue-fill" x="354" y="260" width="246" height="90" rx="10" stroke-width="0.5"/>
<text class="blue-th" x="374" y="290" dominant-baseline="central">Layer 1 — RAG knowledge</text>
<text class="blue-ts" x="374" y="312" dominant-baseline="central">ChromaDB + curriculum docs</text>
<text class="blue-ts" x="374" y="330" dominant-baseline="central">Provides WHAT to draw from</text>

<!-- Labels -->
<rect class="coral-fill" x="80" y="368" width="246" height="36" rx="6" stroke-width="0.5"/>
<text class="coral-th" x="203" y="390" text-anchor="middle" dominant-baseline="central">Behaviour layer</text>
<rect class="blue-fill" x="354" y="368" width="246" height="36" rx="6" stroke-width="0.5"/>
<text class="blue-th" x="477" y="390" text-anchor="middle" dominant-baseline="central">Knowledge layer</text>

<line x1="203" y1="350" x2="203" y2="366" class="arr" marker-end="url(#arrow)"/>
<line x1="477" y1="350" x2="477" y2="366" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="340" y="434" text-anchor="middle">Fine-tuning teaches behaviour. RAG provides knowledge.</text>
<text class="ts" x="340" y="454" text-anchor="middle">The harness enforces quality. Memory compounds it all.</text>
</svg>