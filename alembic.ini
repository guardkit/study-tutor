# Alembic configuration for study-tutor Postgres StudentStore
# TASK-SMP-01 / FEAT-SMP-001 (2026-07-03)
#
# This file is required by the `alembic` CLI. The DSN is read from the
# STUDY_TUTOR_PG_DSN environment variable (see alembic/env.py).

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names; the default is:
# %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps (UTC)
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command;
# if set to 'false', the --autogenerate option to 'revision' will be disabled
# (we want autogenerate, so this is true)
revision_environment = true

# Set to 'true' to enable the 'post_write_hooks' feature
# (e.g., to run formatters like black/ruff on generated migration files)
# post_write_hooks = black,ruff

# The output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# DSN is read from environment variable STUDY_TUTOR_PG_DSN in env.py,
# so sqlalchemy.url is intentionally left empty here.
# This avoids hardcoding credentials in version control.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
